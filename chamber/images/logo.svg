        <rect x="34" y="50" width="52" height="44" rx="2" fill="#F7F6F2"/>
        <rect x="39" y="66" width="10" height="10" fill="#2F6F6B"/>
        <rect x="71" y="66" width="10" height="10" fill="#2F6F6B"/>
        <rect x="53" y="70" width="14" height="24" fill="#A88762"/>

