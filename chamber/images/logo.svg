<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="Mangaldan Chamber of Commerce logo" xmlns:c2pa="http://c2pa.org/manifest">
    <defs>
